<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>Short Video</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  background: #000;
  color: #fff;

  font-family: Arial, sans-serif;

  overflow: hidden;
}

#feed {

  width: 100%;
  height: 100dvh;

  overflow-y: auto;

  scroll-snap-type: y mandatory;
}

.video-card {

  position: relative;

  width: 100%;
  height: 100dvh;

  scroll-snap-align: start;

  background: #000;
}

.video-card video {

  width: 100%;
  height: 100%;

  object-fit: cover;
}

.bottom-info {

  position: absolute;

  left: 16px;
  right: 90px;
  bottom: 30px;

  z-index: 5;

  text-shadow: 0 2px 10px #000;
}

.video-title {

  font-size: 16px;
  font-weight: bold;
}

.video-stats {

  margin-top: 7px;

  font-size: 13px;

  opacity: .9;
}

/* RIGHT BUTTONS */

.actions {

  position: absolute;

  right: 13px;
  bottom: 100px;

  display: flex;
  flex-direction: column;

  gap: 18px;

  z-index: 10;
}

.action {

  border: 0;

  background: transparent;

  color: white;

  font-size: 28px;

  text-align: center;

  text-shadow: 0 2px 10px #000;

  padding: 0;
}

.action span {

  display: block;

  font-size: 12px;

  margin-top: 3px;
}

/* SOUND */

.sound {

  position: absolute;

  top: 18px;
  left: 18px;

  z-index: 20;

  width: 42px;
  height: 42px;

  border: 0;

  border-radius: 50%;

  background: rgba(0,0,0,.55);

  color: white;

  font-size: 20px;
}

/* PREMIUM */

.premium-label {

  display: inline-block;

  margin-top: 8px;

  padding: 5px 9px;

  border-radius: 20px;

  background: #f5c542;

  color: #000;

  font-size: 11px;

  font-weight: bold;
}

/* ADMIN */

#adminButton {

  position: fixed;

  top: 15px;
  right: 15px;

  z-index: 100;

  border: 0;

  border-radius: 25px;

  padding: 10px 15px;

  background: white;

  color: black;

  font-weight: bold;
}

#adminPanel {

  display: none;

  position: fixed;

  inset: 0;

  z-index: 200;

  background: #101010;

  padding: 20px;

  overflow-y: auto;
}

#adminPanel.show {
  display: block;
}

.admin-container {

  max-width: 700px;

  margin: auto;
}

.close {

  border: 1px solid #444;

  background: #222;

  color: white;

  padding: 10px 15px;

  border-radius: 10px;
}

.upload-box {

  margin-top: 20px;

  padding: 20px;

  border: 1px dashed #555;

  border-radius: 15px;
}

#videoFiles {

  width: 100%;

  padding: 12px;

  background: #181818;

  color: white;

  border: 1px solid #333;

  border-radius: 10px;
}

#premiumUpload {

  margin-top: 15px;
}

#uploadButton {

  margin-top: 15px;

  padding: 12px 18px;

  border: 0;

  border-radius: 10px;

  font-weight: bold;
}

.video-row {

  display: flex;

  align-items: center;

  gap: 10px;

  padding: 12px 0;

  border-bottom: 1px solid #222;
}

.video-row-name {

  flex: 1;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;
}

.delete-button {

  border: 1px solid #633;

  background: #311;

  color: white;

  padding: 7px 10px;

  border-radius: 8px;
}

/* COMMENTS */

#commentModal {

  display: none;

  position: fixed;

  inset: 0;

  z-index: 300;

  background: rgba(0,0,0,.75);

  align-items: flex-end;
}

#commentModal.show {

  display: flex;
}

.comment-box {

  width: 100%;

  max-height: 70dvh;

  background: #151515;

  border-radius: 20px 20px 0 0;

  padding: 18px;

  overflow-y: auto;
}

.comment-input {

  display: flex;

  gap: 8px;

  margin-top: 15px;
}

.comment-input input {

  flex: 1;

  padding: 12px;

  border-radius: 10px;

  border: 1px solid #333;

  background: #222;

  color: white;
}

.comment-input button {

  border: 0;

  border-radius: 10px;

  padding: 0 15px;

  font-weight: bold;
}

.comment {

  padding: 10px 0;

  border-bottom: 1px solid #292929;
}

.comment-user {

  font-size: 13px;

  font-weight: bold;
}

.comment-text {

  margin-top: 4px;

  font-size: 14px;
}

/* PREMIUM MODAL */

#premiumModal {

  display: none;

  position: fixed;

  inset: 0;

  z-index: 400;

  background: rgba(0,0,0,.8);

  align-items: center;

  justify-content: center;

  padding: 20px;
}

#premiumModal.show {

  display: flex;
}

.premium-box {

  width: 100%;
  max-width: 390px;

  background: #151515;

  border: 1px solid #333;

  border-radius: 22px;

  padding: 25px;

  text-align: center;
}

.price {

  font-size: 42px;

  font-weight: bold;

  margin: 15px 0;
}

.telegram-button {

  width: 100%;

  padding: 14px;

  border: 0;

  border-radius: 12px;

  background: #229ed9;

  color: white;

  font-weight: bold;

  font-size: 16px;
}

</style>

</head>

<body>


<main id="feed"></main>


<button id="adminButton">
  Upload
</button>


<!-- ADMIN -->

<section id="adminPanel">

<div class="admin-container">

<button class="close" id="closeAdmin">
  Close
</button>

<h2>
  Admin Upload
</h2>

<div class="upload-box">

<input
  id="videoFiles"
  type="file"
  multiple
  accept="video/mp4,video/webm,video/quicktime,.m4v"
>

<label id="premiumUpload">

<br>

<input
  type="checkbox"
  id="premiumCheckbox"
>

 Premium Video

</label>

<br>

<button id="uploadButton">
  Upload Videos
</button>

<div id="uploadStatus"></div>

</div>

<h3>
  Videos
</h3>

<div id="videoList"></div>

</div>

</section>


<!-- COMMENTS -->

<section id="commentModal">

<div class="comment-box">

<button
  class="close"
  id="closeComments"
>
  Close
</button>

<h3>
  Comments
</h3>

<div id="commentsList"></div>

<div class="comment-input">

<input
  id="commentInput"
  placeholder="Write a comment..."
  maxlength="500"
>

<button id="sendComment">
  Send
</button>

</div>

</div>

</section>


<!-- PREMIUM -->

<section id="premiumModal">

<div class="premium-box">

<h2>
  👑 Premium
</h2>

<p>
  Unlock Premium Videos
</p>

<div class="price">
  ₹99
</div>

<p>
  30 Days Access
</p>

<button
  class="telegram-button"
  id="telegramPay"
>
  Pay ₹99 via Telegram
</button>

<br><br>

<button
  class="close"
  id="closePremium"
>
  Close
</button>

</div>

</section>


<script>

let videos = [];

let currentCommentVideo = null;

let soundEnabled = false;


/* LOAD */

async function loadVideos() {

  const response =
    await fetch("/api/videos");

  videos =
    await response.json();

  renderFeed();

  renderAdmin();

}


/* FEED */

function renderFeed() {

  const feed =
    document.getElementById("feed");

  feed.innerHTML = "";

  videos.forEach((video, index) => {

    const card =
      document.createElement("section");

    card.className =
      "video-card";

    card.dataset.id =
      video.id;

    card.innerHTML = `

      <video
        src="${video.url}"
        playsinline
        loop
        muted
        preload="${index < 2 ? "auto" : "metadata"}"
      ></video>

      <button
        class="sound"
        onclick="toggleSound(this)"
      >
        🔇
      </button>

      <div class="actions">

        <button
          class="action"
          onclick="likeVideo('${video.id}', this)"
        >
          ❤️
          <span>${video.likes || 0}</span>
        </button>

        <button
          class="action"
          onclick="openComments('${video.id}')"
        >
          💬
          <span>${video.comments || 0}</span>
        </button>

        <button
          class="action"
          onclick="shareVideo('${video.id}')"
        >
          ↗️
          <span>${video.shares || 0}</span>
        </button>

      </div>

      <div class="bottom-info">

        <div class="video-title">
          ${safe(video.name)}
        </div>

        ${
          video.is_premium
          ? `<div class="premium-label">👑 PREMIUM</div>`
          : ""
        }

        <div class="video-stats">
          👁 ${video.views || 0} views
        </div>

      </div>

    `;

    feed.appendChild(card);

  });

  setupObserver();

}


/* SAFE HTML */

function safe(text) {

  return String(text).replace(
    /[&<>"']/g,

    char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[char])
  );

}


/* AUTO PLAY */

function setupObserver() {

  const observer =
    new IntersectionObserver(

      entries => {

        entries.forEach(entry => {

          const card =
            entry.target;

          const video =
            card.querySelector("video");

          if (!video)
            return;

          if (entry.isIntersecting) {

            video.muted =
              !soundEnabled;

            video.play()
              .catch(() => {});

            if (!card.dataset.viewed) {

              card.dataset.viewed = "1";

              fetch(
                `/api/videos/${card.dataset.id}/view`,
                {
                  method: "POST"
                }
              );

            }

          } else {

            video.pause();

          }

        });

      },

      {
        threshold: .75
      }

    );

  document
    .querySelectorAll(".video-card")
    .forEach(card =>
      observer.observe(card)
    );

}


/* SOUND */

function toggleSound(button) {

  soundEnabled =
    !soundEnabled;

  document
    .querySelectorAll(".video-card video")
    .forEach(video => {

      video.muted =
        !soundEnabled;

      if (!video.paused) {

        video.play()
          .catch(() => {});

      }

    });

  document
    .querySelectorAll(".sound")
    .forEach(btn => {

      btn.textContent =
        soundEnabled
        ? "🔊"
        : "🔇";

    });

}


/* LIKE */

async function likeVideo(id, button) {

  await fetch(
    `/api/videos/${id}/like`,
    {
      method: "POST"
    }
  );

  const number =
    button.querySelector("span");

  number.textContent =
    Number(number.textContent || 0) + 1;

}


/* SHARE */

async function shareVideo(id) {

  await fetch(
    `/api/videos/${id}/share`,
    {
      method: "POST"
    }
  );

  const video =
    videos.find(v => v.id === id);

  const shareUrl =
    location.origin +
    "/?video=" +
    id;

  try {

    if (navigator.share) {

      await navigator.share({
        title: video
          ? video.name
          : "Short Video",
        url: shareUrl
      });

    } else {

      await navigator.clipboard.writeText(
        shareUrl
      );

      alert("Link copied!");

    }

  } catch {}

}


/* COMMENTS */

async function openComments(id) {

  currentCommentVideo =
    id;

  document
    .getElementById("commentModal")
    .classList.add("show");

  loadComments();

}


async function loadComments() {

  const response =
    await fetch(
      `/api/videos/${currentCommentVideo}/comments`
    );

  const comments =
    await response.json();

  const list =
    document.getElementById("commentsList");

  list.innerHTML =
    comments.length
    ? comments.map(c => `

        <div class="comment">

          <div class="comment-user">
            ${safe(c.user_name)}
          </div>

          <div class="comment-text">
            ${safe(c.comment)}
          </div>

        </div>

      `).join("")
    : "<p>No comments yet.</p>";

}


/* SEND COMMENT */

document
  .getElementById("sendComment")
  .onclick = async () => {

    const input =
      document.getElementById("commentInput");

    const comment =
      input.value.trim();

    if (!comment)
      return;

    await fetch(
      `/api/videos/${currentCommentVideo}/comments`,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          userName: "Guest",
          comment
        })
      }
    );

    input.value = "";

    loadComments();

  };


/* CLOSE COMMENTS */

document
  .getElementById("closeComments")
  .onclick = () => {

    document
      .getElementById("commentModal")
      .classList.remove("show");

  };


/* ADMIN */

document
  .getElementById("adminButton")
  .onclick = () => {

    document
      .getElementById("adminPanel")
      .classList.add("show");

  };


document
  .getElementById("closeAdmin")
  .onclick = () => {

    document
      .getElementById("adminPanel")
      .classList.remove("show");

  };


/* ADMIN LIST */

function renderAdmin() {

  const list =
    document.getElementById("videoList");

  list.innerHTML =
    videos.map(video => `

      <div class="video-row">

        <div class="video-row-name">

          ${safe(video.name)}

          ${
            video.is_premium
            ? " 👑"
            : ""
          }

        </div>

        <button
          class="delete-button"
          onclick="deleteVideo('${video.id}')"
        >
          Delete
        </button>

      </div>

    `).join("");

}


/* DELETE */

async function deleteVideo(id) {

  if (!confirm("Delete video?"))
    return;

  await fetch(
    `/api/videos/${id}`,
    {
      method: "DELETE"
    }
  );

  loadVideos();

}


/* UPLOAD */

document
  .getElementById("uploadButton")
  .onclick = async () => {

    const files =
      Array.from(
        document.getElementById("videoFiles").files
      );

    if (!files.length) {

      alert("Select videos first.");

      return;

    }

    const premium =
      document
        .getElementById("premiumCheckbox")
        .checked;

    let completed = 0;

    let failed = 0;

    const queue =
      [...files];

    const workers =
      Math.min(4, files.length);


    async function worker() {

      while (queue.length) {

        const file =
          queue.shift();

        const formData =
          new FormData();

        formData.append(
          "videos",
          file
        );

        formData.append(
          "premium",
          premium
        );

        try {

          await new Promise(
            (resolve, reject) => {

              const xhr =
                new XMLHttpRequest();

              xhr.open(
                "POST",
                "/api/upload"
              );

              xhr.upload.onprogress =
                event => {

                  if (!event.lengthComputable)
                    return;

                  const percent =
                    Math.round(
                      event.loaded /
                      event.total *
                      100
                    );

                  document
                    .getElementById(
                      "uploadStatus"
                    )
                    .textContent =
                    `Uploading ${completed + 1}/${files.length} — ${percent}%`;

                };

              xhr.onload = () => {

                if (
                  xhr.status >= 200 &&
                  xhr.status < 300
                ) {

                  resolve();

                } else {

                  reject();

                }

              };

              xhr.onerror =
                () => reject();

              xhr.send(formData);

            }
          );

          completed++;

        } catch {

          failed++;

        }

      }

    }


    await Promise.all(

      Array
        .from(
          { length: workers }
        )
        .map(worker)

    );


    document
      .getElementById("uploadStatus")
      .textContent =
      `Done: ${completed} uploaded` +
      (
        failed
        ? `, ${failed} failed`
        : ""
      );

    document
      .getElementById("videoFiles")
      .value = "";

    loadVideos();

  };


/* PREMIUM */

function openPremium() {

  document
    .getElementById("premiumModal")
    .classList.add("show");

}


document
  .getElementById("closePremium")
  .onclick = () => {

    document
      .getElementById("premiumModal")
      .classList.remove("show");

  };


/*
Telegram payment button.

Replace @YOUR_BOT_USERNAME
with your actual Telegram bot username.
*/

document
  .getElementById("telegramPay")
  .onclick = () => {

    const botUsername =
      "YOUR_BOT_USERNAME";

    const url =
      `https://t.me/${botUsername}?start=premium99`;

    window.open(
      url,
      "_blank"
    );

  };


/* INITIAL */

loadVideos();

</script>

</body>

</html>
