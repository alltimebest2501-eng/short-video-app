<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,viewport-fit=cover"
>

<title>Short Video</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

#feed {
  width: 100%;
  height: 100dvh;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
}

.video {
  width: 100%;
  height: 100dvh;
  position: relative;
  scroll-snap-align: start;
  background: #000;
}

.video video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.video-name {
  position: absolute;
  bottom: 25px;
  left: 16px;
  right: 70px;

  font-size: 15px;
  font-weight: 500;

  text-shadow:
    0 2px 10px #000;
}

/* ADMIN BUTTON */

#adminButton {
  position: fixed;

  top: 15px;
  right: 15px;

  z-index: 100;

  border: none;
  border-radius: 30px;

  padding: 10px 16px;

  background: white;
  color: black;

  font-weight: bold;
}

/* ADMIN */

#adminPanel {

  position: fixed;

  inset: 0;

  z-index: 200;

  display: none;

  background: #101010;

  overflow-y: auto;

  padding: 20px;
}

#adminPanel.show {
  display: block;
}

.admin-container {
  max-width: 700px;
  margin: auto;
}

.close {

  border: 1px solid #444;

  background: #222;

  color: white;

  padding: 10px 15px;

  border-radius: 10px;
}

.upload-box {

  margin-top: 20px;

  border: 1px dashed #555;

  border-radius: 16px;

  padding: 25px;

  text-align: center;
}

#videoFiles {

  width: 100%;

  padding: 12px;

  background: #181818;

  color: white;

  border: 1px solid #333;

  border-radius: 10px;
}

#uploadButton {

  margin-top: 15px;

  padding: 12px 20px;

  border: none;

  border-radius: 10px;

  font-weight: bold;
}

#uploadStatus {

  margin-top: 15px;

  font-size: 14px;
}

.video-row {

  display: flex;

  align-items: center;

  gap: 10px;

  padding: 12px 0;

  border-bottom: 1px solid #222;
}

.video-row-name {

  flex: 1;

  overflow: hidden;

  white-space: nowrap;

  text-overflow: ellipsis;
}

.delete-button {

  border: 1px solid #633;

  background: #311;

  color: white;

  padding: 7px 10px;

  border-radius: 8px;
}

</style>

</head>

<body>


<!-- VIDEO FEED -->

<main id="feed"></main>


<!-- ADMIN BUTTON -->

<button id="adminButton">
  Upload
</button>


<!-- ADMIN PANEL -->

<section id="adminPanel">

<div class="admin-container">

<button class="close" id="closeButton">
  Close
</button>

<h2>
  Upload Videos
</h2>

<div class="upload-box">

<input
  id="videoFiles"
  type="file"
  multiple
  accept="video/mp4,video/webm,video/quicktime,.m4v"
>

<br>

<button id="uploadButton">
  Upload Selected Videos
</button>

<div id="uploadStatus"></div>

</div>

<h3>
  Uploaded Videos
</h3>

<div id="videoList"></div>

</div>

</section>


<script>

/* ELEMENTS */

const feed =
  document.getElementById("feed");

const adminPanel =
  document.getElementById("adminPanel");

const videoFiles =
  document.getElementById("videoFiles");

const uploadStatus =
  document.getElementById("uploadStatus");

const videoList =
  document.getElementById("videoList");


/* HTML SAFE */

function safe(text) {

  return String(text).replace(
    /[&<>"']/g,

    char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[char])
  );
}


/* LOAD VIDEOS */

async function loadVideos() {

  try {

    const response =
      await fetch("/api/videos");

    const videos =
      await response.json();

    feed.innerHTML = "";

    videos.forEach((video, index) => {

      const item =
        document.createElement("section");

      item.className = "video";

      item.innerHTML = `

        <video
          src="${video.url}"
          playsinline
          loop
          muted
          preload="${index < 2 ? "auto" : "metadata"}"
        ></video>

        <div class="video-name">
          ${safe(video.name)}
        </div>

      `;

      feed.appendChild(item);

    });

    setupAutoPlay();

    renderAdminList(videos);

  } catch (error) {

    console.error(error);

  }

}


/* AUTO PLAY */

function setupAutoPlay() {

  const observer =
    new IntersectionObserver(

      entries => {

        entries.forEach(entry => {

          const video =
            entry.target.querySelector("video");

          if (!video) return;

          if (entry.isIntersecting) {

            video.play().catch(() => {});

          } else {

            video.pause();

          }

        });

      },

      {
        threshold: 0.7
      }

    );


  document
    .querySelectorAll(".video")
    .forEach(item => {

      observer.observe(item);

    });

}


/* ADMIN LIST */

function renderAdminList(videos) {

  if (!videos.length) {

    videoList.innerHTML =
      "<p>No videos uploaded.</p>";

    return;

  }

  videoList.innerHTML =
    videos.map(video => `

      <div class="video-row">

        <div class="video-row-name">
          ${safe(video.name)}
        </div>

        <button
          class="delete-button"
          onclick="deleteVideo('${video.id}')"
        >
          Delete
        </button>

      </div>

    `).join("");

}


/* DELETE */

async function deleteVideo(id) {

  const yes =
    confirm("Delete this video?");

  if (!yes) return;

  await fetch(
    "/api/videos/" + id,
    {
      method: "DELETE"
    }
  );

  loadVideos();

}


/* OPEN ADMIN */

document
  .getElementById("adminButton")
  .onclick = () => {

    adminPanel.classList.add("show");

  };


/* CLOSE ADMIN */

document
  .getElementById("closeButton")
  .onclick = () => {

    adminPanel.classList.remove("show");

  };


/* UPLOAD */

document
  .getElementById("uploadButton")
  .onclick = async () => {

    const files =
      Array.from(videoFiles.files);

    if (!files.length) {

      alert("Please select videos.");

      return;

    }


    uploadStatus.textContent =
      `Uploading ${files.length} videos...`;


    let completed = 0;
    let failed = 0;

    /*
      4 videos upload at the same time.
    */

    const queue = [...files];

    const concurrency =
      Math.min(4, files.length);


    async function worker() {

      while (queue.length) {

        const file =
          queue.shift();

        const formData =
          new FormData();

        formData.append(
          "videos",
          file
        );


        try {

          await new Promise(
            (resolve, reject) => {

              const xhr =
                new XMLHttpRequest();

              xhr.open(
                "POST",
                "/api/upload"
              );


              xhr.upload.onprogress =
                event => {

                  if (!event.lengthComputable)
                    return;

                  const percent =
                    Math.round(
                      event.loaded /
                      event.total *
                      100
                    );

                  uploadStatus.textContent =
                    `Uploading ${completed + 1}/${files.length} — ${file.name} — ${percent}%`;

                };


              xhr.onload = () => {

                if (
                  xhr.status >= 200 &&
                  xhr.status < 300
                ) {

                  resolve();

                } else {

                  reject();

                }

              };


              xhr.onerror =
                () => reject();


              xhr.send(formData);

            }
          );


          completed++;

        } catch {

          failed++;

        }


        uploadStatus.textContent =
          `Uploaded ${completed}/${files.length}` +
          (failed
            ? ` • Failed ${failed}`
            : "");

      }

    }


    await Promise.all(

      Array
        .from(
          { length: concurrency }
        )
        .map(worker)

    );


    uploadStatus.textContent =
      `Done — ${completed} uploaded` +
      (failed
        ? `, ${failed} failed`
        : "");


    videoFiles.value = "";

    loadVideos();

  };


/* START */

loadVideos();

</script>

</body>

</html>
